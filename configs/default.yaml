paper:
  slug: impact-of-sunglasses-on-one-to-many-facial-identification-accuracy
  title: "Impact of Sunglasses on One-to-Many Facial Identification Accuracy"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  pretrained: true
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 64
  epochs: 8
  lr: 0.05
  sunglass_prob: 0.5
eval:
  batch_size: 128
  max_lfw_pairs: null
  max_gallery: null
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
